<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storyboard OS Capture</title><style>body{font:14px/1.5 system-ui;background:#10192a;color:#edf3ff;width:330px;padding:16px;margin:0}h2{font-size:17px;margin:0 0 8px}p{color:#aab8cf;font-size:12px}label{display:grid;gap:5px;margin:10px 0;color:#aab8cf;font-size:11px}input{padding:9px;border-radius:8px;border:1px solid #354763;background:#0b1425;color:white}button{padding:9px 12px;border:0;border-radius:8px;background:#8edce6;color:#102030;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#263550;color:#edf3ff}.status{padding:9px;background:#17243a;border-radius:8px;font-size:12px;margin:10px 0}.small{font-size:10px;color:#91a1bb}</style></head><body><h2>Storyboard OS</h2><p>Connect this extension to your private Supabase project. Only ChatGPT tabs are observed.</p><div id="status" class="status">Not connected</div><form id="form"><label>Supabase project URL<input id="url" type="url" placeholder="https://YOUR-PROJECT.supabase.co" required></label><label>Supabase anon / publishable key<input id="key" type="password" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button type="submit">Connect securely</button></form><div><button id="pause" class="secondary">Pause capture</button><button id="disconnect" class="secondary">Disconnect</button></div><p class="small">Capture is automatic while enabled. Pause or disconnect at any time. Your Supabase service-role key must never be used here.</p><div id="message" class="small"></div><script src="popup.js"></script></body></html>
